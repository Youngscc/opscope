name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and generated page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install web dependencies
        run: |
          python3 -m pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci

      - name: Validate Vue application
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Run unit tests
        run: python3 -B -m unittest discover -s . -p 'test_*.py' -v

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check configuration.js
          node --check catalog-ui.js
          node --check evaluation-ui.js
          node --check trace-ui.js

      - name: Build page
        run: python3 -B build.py

      - name: Check generated page is up to date
        run: git diff --exit-code -- index.html
