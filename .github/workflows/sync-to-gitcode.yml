name: Sync development branch to GitCode

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅检查，不写入 GitCode'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: github-to-gitcode-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Youngscc/opscope' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.GITCODE_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Test branch synchronization
        run: python3 -B .github/scripts/test_sync_gitcode_branch.py -v
      - name: Synchronize only the configured branch
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_USERNAME: ${{ vars.GITCODE_USERNAME || 'oauth2' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [ -z "$GITCODE_TOKEN" ]; then
            echo '::error::请在本仓库 Actions Secrets 中设置 GITCODE_TOKEN。'
            exit 1
          fi
          askpass_file=$(mktemp "$RUNNER_TEMP/gitcode-askpass.XXXXXX")
          trap 'rm -f "$askpass_file"' EXIT
          cat > "$askpass_file" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITCODE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITCODE_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass_file"
          export GIT_ASKPASS="$askpass_file"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=''
          bash .github/scripts/sync_gitcode_branch.sh \
            'https://gitcode.com/YYoung_G/opscope.git' 'main' "$DRY_RUN"
