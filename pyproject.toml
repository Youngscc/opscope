# uv 项目依赖的源声明；完整解析结果保存在 uv.lock，并导出到 backend/requirements*.txt。
# 未声明 build-system，uv 视为虚拟项目，只安装依赖，不把 opscope 本身装入环境。
[project]
name = "opscope"
version = "0.1.0"
description = "OpScope · 算子性能观察台的 Web 运行环境"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "msopmodeling==1.0.9",
    "uvicorn==0.52.4",
]

[tool.uv.sources]
msopmodeling = { path = "vendor/msopmodeling/msopmodeling-1.0.9-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx==0.28.1",
]
